name: StockPilot CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint, TypeCheck & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockpilot
          POSTGRES_PASSWORD: stockpilot_dev_password
          POSTGRES_DB: stockpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/backend/package-lock.json'

      - name: Install backend dependencies
        run: npm ci
        working-directory: apps/backend

      - name: TypeCheck backend
        run: npx tsc --noEmit
        working-directory: apps/backend

      - name: Apply database migrations
        run: npm run db:migrate
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://stockpilot:stockpilot_dev_password@localhost:5432/stockpilot

      - name: Run backend tests
        run: npm test
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://stockpilot:stockpilot_dev_password@localhost:5432/stockpilot
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-secret-key-12345
          JWT_REFRESH_SECRET: test-secret-key-67890

  frontend-build:
    name: Frontend Lint, TypeCheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend
